server:
  port: 8080

spring:
  application:
    name: london-meet-backend

  datasource:
    url: jdbc:mysql://localhost:3306/london_meet?useSSL=false&serverTimezone=America/Toronto&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret-key: londonmeetjwtsecretkeylondonmeetjwtsecretkey
  expiration: 604800000

wechat:
  # Keep true while testing the backend without real mini program pages.
  # With mock enabled, pass either openid directly or pass code such as "mock:test-user".
  mock-enabled: ${WECHAT_MOCK_ENABLED:true}
  app-id: ${WECHAT_APP_ID:}
  secret: ${WECHAT_APP_SECRET:}
