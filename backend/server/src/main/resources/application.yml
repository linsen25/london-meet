server:
  port: 8080

spring:
  application:
    name: london-meet-backend

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3306/london_meet?useSSL=false&serverTimezone=America/Toronto&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret-key: londonmeetjwtsecretkeylondonmeetjwtsecretkey
  expiration: 604800000

wechat:
  mock-enabled: true
  app-id: wx1f685f2109d776a0
  secret: edd9927fb9d9e2fdc2113fd014dd95d2
  
upload:
  avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatar}
  avatar-url-prefix: /uploads/avatar
  default-avatar-url: /uploads/avatar/default-avatar.png
  cover-dir: ${COVER_UPLOAD_DIR:uploads/cover}
  cover-url-prefix: /uploads/cover
  default-cover-url: https://dummyimage.com/1200x800/2b2b2b/ffffff.png&text=Cover
